services:
  postgres:
    image: postgres:16
    container_name: attendance-db
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5445:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: attendance-app
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/attendance
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      JWT_SECRET: PresenceNumeriqueM1MIAGESecretKey2026SuperLongKeyForHS256Algorithm
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
