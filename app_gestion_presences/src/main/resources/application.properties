spring.application.name=app_gestion_presences
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/attendance}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET:PresenceNumeriqueM1MIAGESecretKey2026SuperLongKeyForHS256Algorithm}
jwt.expiration=86400000

# Journaux applicatifs : bibliothèques en WARN, événements métier de l'application en INFO.
# Sortie console (collectée par Railway) + fichier logs/presence.log avec rotation.
logging.level.root=WARN
logging.level.com.example=INFO
logging.file.name=${LOG_FILE:logs/presence.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
