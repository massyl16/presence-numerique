<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin — Présence Numérique</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="sidebar">
    <div class="brand">
        <div class="logo">✓</div>
        <div><div class="name">Présence</div><div class="sub">Numérique</div></div>
    </div>
    <div class="nav-label">Navigation</div>
    <a class="nav-item active" th:href="@{/admin/accueil}"><span class="ico">🏠</span> Accueil</a>
    <a class="nav-item" th:href="@{/admin/affectations}"><span class="ico">🔗</span> Affectations</a>
    <a class="nav-item" th:href="@{/admin/historique}"><span class="ico">📊</span> Historique global</a>
    <div class="role-badge" style="margin-top:auto">
        <div class="r" th:text="${email}">Admin</div>
        <div class="e">ADMINISTRATEUR</div>
    </div>
    <a class="nav-item" th:href="@{/compte}" style="margin-top:10px"><span class="ico">👤</span> Mon compte</a>
    <a th:href="@{/logout}" class="nav-item"><span class="ico">🚪</span> Déconnexion</a>
</div>

<div class="main">
    <div class="topbar">
        <div><h1>Administration</h1><p>Vue d'ensemble du système.</p></div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="val" th:text="${nbEtudiants}">0</div>
            <div class="lbl">Étudiants</div>
        </div>
        <div class="stat-card">
            <div class="val" th:text="${nbEnseignants}">0</div>
            <div class="lbl">Enseignants</div>
        </div>
        <div class="stat-card">
            <div class="val" th:text="${nbSecretariat}">0</div>
            <div class="lbl">Secrétariat</div>
        </div>
    </div>

    <!-- Liste de tous les utilisateurs -->
    <div class="card">
        <div style="font-size:14px;font-weight:700;color:#15233F;margin-bottom:16px">
            Tous les comptes (<span th:text="${#lists.size(users)}">0</span>)
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Rôle</th>
                        <th>Promotion</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.firstname + ' ' + u.lastname}">—</td>
                        <td th:text="${u.email}">—</td>
                        <td>
                            <span th:class="${u.role.name() == 'ADMIN' ? 'badge ouvert' :
                                             (u.role.name() == 'ENSEIGNANT' ? 'badge present' :
                                             (u.role.name() == 'SECRETARIAT' ? 'badge retard' : 'badge absent'))}"
                                  th:text="${u.role.name()}"></span>
                        </td>
                        <td th:text="${u.promotion != null ? u.promotion.name : '—'}">—</td>
                        <td style="display:flex;gap:8px">
                            <form th:action="@{/admin/users/{id}/reset-password(id=${u.id})}" method="post">
                                <button type="submit" class="btn secondary" style="font-size:11px;padding:6px 12px">Reset MDP</button>
                            </form>
                            <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                                  onsubmit="return confirm('Supprimer ce compte ?')">
                                <button type="submit" class="btn danger" style="font-size:11px;padding:6px 12px">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
