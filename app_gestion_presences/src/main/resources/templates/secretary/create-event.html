<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Créer un événement</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
        }

        .form-container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input, select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .btn-create {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0d6efd;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-create:hover {
            background: #0b5ed7;
        }
    </style>
</head>
<body>

<div class="form-container">

    <h1>Créer un événement</h1>

    <form th:action="@{/secretary/events/new/create}" method="post">

        <div class="form-group">
            <label>Titre</label>
            <input type="text" name="title" required>
        </div>

        <div class="form-group">
            <label>Lieu</label>
            <input type="text" name="location" required>
        </div>

        <div class="form-group">
            <label>Heure de début</label>
            <input type="datetime-local" name="startTime" required>
        </div>

        <div class="form-group">
            <label>Heure de fin</label>
            <input type="datetime-local" name="endTime" required>
        </div>

        <div class="form-group">
            <label>Limite retard en minutes</label>
            <input type="number" name="lateTime" required>
        </div>

        <div class="form-group">
            <label>Latitude</label>
            <input type="number" step="0.000001" name="latitude" required>
        </div>

        <div class="form-group">
            <label>Longitude</label>
            <input type="number" step="0.000001" name="longitude" required>
        </div>

        <button type="button" onclick="getLocation()">
            Utiliser ma position actuelle
        </button>

        <div class="form-group">
            <label>Rayon autorisé (mètres)</label>
            <input type="number" step="0.1" name="radius" required>
        </div>

        <div class="form-group">
            <label>Intervenant</label>
            <select id="speaker" name="speakerId">
                <option value="">Choisir un intervenant</option>

                <option th:each="s : ${speakers}"
                        th:value="${s.id}"
                        th:text="${s.firstname + ' ' + s.lastname}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Participants</label>
            <select id="participants" name="participant_list" multiple>
                <option th:each="p : ${participants}"
                        th:value="${p.id}"
                        th:text="${p.firstname + ' ' + p.lastname}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn-create">
            Créer l'événement
        </button>

    </form>

</div>

<link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

<script>
    new TomSelect("#participants", {
        plugins: ['remove_button'],
        placeholder: "Ajouter des participants"
    });
</script>

<script>
    new TomSelect("#speaker", {
        maxItems: 1,
        placeholder: "Rechercher un intervenant"
    });
</script>

<script>
    function getLocation() {

        if (!navigator.geolocation) {
            alert("Géolocalisation non supportée");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function (position) {

                document.querySelector("input[name='latitude']").value =
                    position.coords.latitude;

                document.querySelector("input[name='longitude']").value =
                    position.coords.longitude;
            },
            function (error) {
                console.error(error);
                alert("Impossible de récupérer la position");
            }
        );
    }
</script>

</body>
</html>
