<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Créer un groupe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
        }

        .form-container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input, select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .btn-create {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0d6efd;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-create:hover {
            background: #0b5ed7;
        }
    </style>
</head>
<body>

<div class="form-container">

    <h1>Sélection de la promotion</h1>

    <form th:action="@{/secretary/group_gestion/group/select}" method="post">

        <div class="form-group">

            <label>Promotion</label>

            <select name="promotionId">

                <option th:each="p : ${promotions}"
                        th:value="${p.id}"
                        th:text="${p.name}">
                </option>

            </select>

        </div>

        <button class="btn-create" type="submit">
            Continuer
        </button>

    </form>

</div>

</body>
</html>
