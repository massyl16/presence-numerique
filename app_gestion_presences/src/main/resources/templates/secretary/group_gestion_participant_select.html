<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ajouter un participant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
        }

        .form-container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input, select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .btn-create {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0d6efd;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-create:hover {
            background: #0b5ed7;
        }
    </style>
</head>
<body>

<div class="form-container">

    <h1 th:text="'Nouveau participant - ' + ${promotion.name}"></h1>

    <form th:action="@{/secretary/group_gestion/participant/select/create}" method="post">

        <input type="hidden"
               name="promotionId"
               th:value="${promotion.id}">

        <div class="form-group">
            <label>Prénom</label>
            <input type="text" name="firstname" required>
        </div>

        <div class="form-group">
            <label>Nom</label>
            <input type="text" name="lastname" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">

            <label>Groupe</label>

            <select name="groupId">

                <option th:each="g : ${groups}"
                        th:value="${g.id}"
                        th:text="${g.name}">
                </option>

            </select>

        </div>

        <button class="btn-create" type="submit">
            Ajouter
        </button>

    </form>

</div>

</body>
</html>
