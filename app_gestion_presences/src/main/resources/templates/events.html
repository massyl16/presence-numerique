<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Événements</title>
</head>
<body>

<h1>Liste des événements</h1>

<a href="/events/new">
    Créer un événement
</a>

<br><br>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Titre</th>
    </tr>

    <tr th:each="event : ${events}">
        <td th:text="${event.id}"></td>
        <td th:text="${event.title}"></td>
    </tr>

</table>

</body>
</html>
