<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Présence Numérique</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
    <div class="login-box">
        <div class="login-logo">
            <div class="logo-icon">✓</div>
            <h1>Présence Numérique</h1>
            <p>Émargement numérique — M1 MIAGE</p>
        </div>

        <div class="login-alert" th:if="${param.error}">
            Email ou mot de passe incorrect.
        </div>
        <div class="login-success" th:if="${param.logout}">
            Vous avez été déconnecté avec succès.
        </div>

        <form method="post" th:action="@{/login}">
            <div class="form-group">
                <label class="form-label" for="username">Adresse email</label>
                <input class="form-control" type="email" id="username" name="username"
                       placeholder="votre@email.com" required autofocus/>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Mot de passe</label>
                <input class="form-control" type="password" id="password" name="password"
                       placeholder="••••••••" required/>
            </div>
            <button type="submit" class="login-btn">Se connecter</button>
        </form>
    </div>
</body>
</html>
