<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Faire l'appel — Présence Numérique</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="sidebar">
    <div class="brand">
        <div class="logo">✓</div>
        <div><div class="name">Présence</div><div class="sub">Numérique</div></div>
    </div>
    <div class="nav-label">Navigation</div>
    <a class="nav-item" th:href="@{/enseignant/accueil}"><span class="ico">🏠</span> Accueil</a>
    <a class="nav-item active" th:href="@{/enseignant/appel}"><span class="ico">📋</span> Faire l'appel</a>
    <a class="nav-item" th:href="@{/enseignant/historique}"><span class="ico">📊</span> Historique</a>
    <div class="role-badge" style="margin-top:auto">
        <div class="r" th:text="${enseignant.firstname + ' ' + enseignant.lastname}">Enseignant</div>
        <div class="e">ENSEIGNANT</div>
    </div>
    <a class="nav-item" th:href="@{/compte}" style="margin-top:10px"><span class="ico">👤</span> Mon compte</a>
    <a th:href="@{/logout}" class="nav-item"><span class="ico">🚪</span> Déconnexion</a>
</div>

<div class="main">
    <div class="topbar">
        <div>
            <h1>Faire l'appel</h1>
            <p>Sélectionnez la promotion et le groupe, puis démarrez l'appel.</p>
        </div>
    </div>

    <div class="card" style="max-width:540px">
        <h2 style="font-size:16px;color:#15233F;margin-bottom:20px;font-weight:700">Paramètres de la séance</h2>

        <form id="appel-form" th:action="@{/enseignant/appel/start}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Promotion</label>
                    <select class="form-control" name="promotionId" id="sel-promo"
                            onchange="filterGroupes(this.value)" required>
                        <option value="">-- Choisir --</option>
                        <option th:each="promo : ${promotions}"
                                th:value="${promo.id}"
                                th:text="${promo.name}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Groupe</label>
                    <select class="form-control" name="groupeId" id="sel-groupe">
                        <option value="">Tous les groupes</option>
                        <option th:each="g : ${groupes}"
                                th:value="${g.id}"
                                th:text="${g.name}"
                                th:attr="data-promo=${g.promotion.id}"></option>
                    </select>
                </div>
            </div>

            <!-- Titre de la séance -->
            <div class="form-group">
                <label class="form-label">Intitulé de la séance <span style="color:#8A95AC;font-weight:400">(optionnel)</span></label>
                <input class="form-control" name="title" placeholder="ex: Cours de Java, TD Bases de données…"/>
            </div>

            <!-- Seuil de retard -->
            <div class="form-group">
                <label class="form-label">Seuil de retard</label>
                <select class="form-control" name="lateThreshold">
                    <option value="5">5 minutes</option>
                    <option value="10">10 minutes</option>
                    <option value="15" selected>15 minutes</option>
                    <option value="20">20 minutes</option>
                </select>
            </div>

            <!-- Champs cachés pour les coordonnées GPS -->
            <input type="hidden" name="latitude"  id="lat" value="0">
            <input type="hidden" name="longitude" id="lon" value="0">

            <div style="background:#EEF1F6;border-radius:9px;padding:12px 14px;margin-bottom:18px;font-size:12.5px;color:#4B5563;">
                📍 <span id="gps-status">Localisation en cours…</span>
            </div>

            <button type="submit" class="btn" id="start-btn" disabled>
                Démarrer l'appel
            </button>
        </form>
    </div>
</div>

<script>
    const startBtn = document.getElementById('start-btn');
    const gpsStatus = document.getElementById('gps-status');

    function filterGroupes(promoId) {
        const sel = document.getElementById('sel-groupe');
        sel.value = '';
        Array.from(sel.options).forEach(opt => {
            if (opt.value === '') {
                opt.hidden = false;
            } else {
                opt.hidden = (promoId !== '' && opt.dataset.promo !== promoId);
            }
        });
    }

    function getLocation() {
        if (!navigator.geolocation) {
            gpsStatus.innerHTML = 'Géolocalisation non disponible. <button type="button" onclick="skipGps()" style="margin-left:8px;text-decoration:underline;border:none;background:none;cursor:pointer;color:#C2841B">Continuer sans GPS</button>';
            return;
        }
        gpsStatus.textContent = 'Localisation en cours…';
        navigator.geolocation.getCurrentPosition(
            pos => {
                document.getElementById('lat').value = pos.coords.latitude;
                document.getElementById('lon').value = pos.coords.longitude;
                gpsStatus.textContent = `✓ Position obtenue (précision : ${Math.round(pos.coords.accuracy)} m)`;
                startBtn.disabled = false;
            },
            err => {
                gpsStatus.innerHTML = '⚠ Localisation refusée ou indisponible. '
                    + '<button type="button" onclick="getLocation()" style="margin-left:6px;text-decoration:underline;border:none;background:none;cursor:pointer;color:#3730A3">Réessayer</button>'
                    + ' <button type="button" onclick="skipGps()" style="margin-left:6px;text-decoration:underline;border:none;background:none;cursor:pointer;color:#C2841B">Continuer sans GPS</button>';
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function skipGps() {
        gpsStatus.textContent = '⚠ Démarrage sans GPS — la validation de proximité étudiante sera désactivée.';
        document.getElementById('lat').value = '0';
        document.getElementById('lon').value = '0';
        startBtn.disabled = false;
    }

    getLocation();
</script>
</body>
</html>
