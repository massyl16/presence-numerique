<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Événements</title>
    <style>.events-container {
    max-width: 1200px;
    margin: 40px auto;
    padding: 20px;

    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 25px;
    }

    .event-card {
    background: white;
    border-radius: 18px;
    padding: 25px;

    box-shadow: 0 6px 18px rgba(0,0,0,0.08);

    transition: 0.25s;
    }

    .event-card:hover {
    transform: translateY(-4px);

    box-shadow: 0 12px 28px rgba(0,0,0,0.12);
    }

    .event-header h3 {
    margin: 0;
    color: #1f2937;
    }

    .event-info {
    margin-top: 15px;
    color: #6b7280;
    }

    .event-info p {
    margin: 8px 0;
    }

    .details-btn {
    display: inline-block;

    margin-top: 20px;
    padding: 10px 18px;

    border-radius: 10px;

    text-decoration: none;

    background: #2563eb;
    color: white;

    font-weight: 600;
    }

    .details-btn:hover {
    background: #1d4ed8;
    }

    .page-header {
    text-align: center;
    margin: 40px 0;
    }

    .page-header h1 {
    font-size: 2.2rem;
    margin-bottom: 10px;
    }

    .page-header p {
    color: #6b7280;
    }
    </style>
</head>
<body>

<div class="page-header">
    <h1>Mes événements</h1>
    <p>Consultez les événements auxquels vous êtes intervenants.</p>
</div>


<div class="events-container">

    <div class="event-card" th:each="event : ${events}">

        <div class="event-header">
            <h3 th:text="${event.title}">Nom événement</h3>
        </div>

        <div class="event-info">
            <p><span th:text="${event.date}"></span></p>
            <p><span th:text="${event.place}"></span></p>
        </div>

        <a th:href="@{/speaker/events/{id}(id=${event.id})}"
           class="details-btn">
            Démarrer l'évênement
        </a>

    </div>

</div>

</body>
</html>
