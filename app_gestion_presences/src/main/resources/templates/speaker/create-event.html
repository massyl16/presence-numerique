<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Créer un événement</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
        }

        .form-container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input, select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .btn-create {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0d6efd;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-create:hover {
            background: #0b5ed7;
        }
    </style>
</head>
<body>

<div class="form-container">

    <h1>Créer un événement</h1>

    <form th:action="@{/speaker/events/new/select}" method="post">


        <div class="form-group">
            <label>Promotion</label>
            <select id="promotion" name="promotionId">
                <option value="">Choisir une promotion</option>

                <option th:each="p : ${promotions}"
                        th:value="${p.id}"
                        th:text="${p.name}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn-create">
            Valider
        </button>

    </form>

</div>

<link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

<script>
    new TomSelect("#promotion", {
        maxItems: 1,
        placeholder: "Rechercher une promotion"
    });
</script>

<script>
    new TomSelect("#group", {
        maxItems: 1,
        placeholder: "Rechercher un groupe"
    });
</script>

<script>
    function getLocation() {

        if (!navigator.geolocation) {
            alert("Géolocalisation non supportée");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function (position) {

                document.querySelector("input[name='latitude']").value =
                    position.coords.latitude;

                document.querySelector("input[name='longitude']").value =
                    position.coords.longitude;
            },
            function (error) {
                console.error(error);
                alert("Impossible de récupérer la position");
            }
        );
    }
</script>

</body>
</html>
